image: ${BENCHMARKS_REGISTRY}/${BENCHMARKS_CONTAINER}${BENCHMARKS_SIGIL}${BENCHMARKS_TAG}

variables:
  DETECTOR: epic
  DETECTOR_CONFIG: epic_craterlake
  DETECTOR_PREFIX: /opt/detector/epic-main
  SNAKEMAKE_FLAGS: '--cache'

workflow:
  name: '$PIPELINE_NAME'

default:
  id_tokens:
    CI_JOB_JWT:
      aud: ${CI_SERVER_PROTOCOL}://${CI_SERVER_HOST}
  before_script:
    - source bin/env.sh
  tags:
    - phy-scratch
  artifacts:
    expire_in: 3 days
    paths:
      - .local/root_build
      - .snakemake/log
      - results
      - config
      - .env
      - summary.txt
    reports:
      dotenv: .env
    when: always

stages:
  - status-pending
  - config
  - compile
  - generate
  - simulate
  - collect
  - finish
  - status-report

.status:
  image: curlimages/curl:latest
  rules:
    - if: $GITHUB_SHA !~ /^$/ # when GITHUB_SHA non-empty
  before_script: []
  script:
    - |
      curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: token ${GITHUB_REPO_STATUS_TOKEN}" \
        "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
        -d '{"state":"'"${STATE}"'",
             "target_url":"'"${CI_PIPELINE_URL}"'",
             "description":"'"$(TZ=America/New_York date)"'",
             "context":"eicweb/physics_benchmarks ('"${BENCHMARKS_TAG}"', '"$DETECTOR_CONFIG"')"
            }' ;
  retry:
    max: 2
    when:
      - runner_system_failure

benchmarks:physics:pending:
  stage: status-pending
  extends: .status
  variables:
    STATE: "pending"
  when: always

common:setup:
  stage: config
  image: alpine
  before_script: []
  script:
    - source bin/env.sh
    - bin/mkdir_local_data_link sim_output
    - mkdir -p results
    - mkdir -p config

.compile_benchmark:
  needs:
    - ["common:setup"]
  retry:
    max: 2
    when:
      - runner_system_failure

.phy_benchmark:
  needs:
    - ["common:setup"]
  before_script:
    - source bin/env.sh
    # pass DETECTOR_CONFIG, or thisepic.sh resets it to its default "epic"
    - source ${DETECTOR_PREFIX}/bin/thisepic.sh "${DETECTOR_CONFIG}"
    - ls -lrtha
    - ln -s "${LOCAL_DATA_PATH}/sim_output" sim_output
    - mkdir -p "$SNAKEMAKE_OUTPUT_CACHE"
    # remove dangling symlinks to garbage-collected cache entries, so snakemake regenerates them
    - find -L "${LOCAL_DATA_PATH}/sim_output" -type l -print -delete || true
    - ls -lrtha
  retry:
    max: 2
    when:
      - runner_system_failure

include:
  - local: 'benchmarks/Exclusive-Diffraction-Tagging/diffractive_vm/config.yml'
  - local: 'benchmarks/Exclusive-Diffraction-Tagging/demp/config.yml'
  - local: 'benchmarks/Exclusive-Diffraction-Tagging/semi_coherent/config.yml'
    #- local: 'benchmarks/Exclusive-Diffraction-Tagging/dvmp/config.yml'
  - local: 'benchmarks/Inclusive/dis/config.yml'
  - local: 'benchmarks/Jets-HF/jets/config.yml'

summary:
  stage: finish
  needs:
    - "diffractive_vm:results"
    - "demp:results"
    - "dis:results"
    - "jets:results"
  script:
    - bin/collect_benchmarks.py
    - find results -print | sort | tee summary.txt
  artifacts:
    paths:
      - summary.txt
      - results/*
  retry:
    max: 2
    when:
      - runner_system_failure

benchmarks:physics:success:
  stage: status-report
  dependencies: []
  extends: .status
  variables:
    STATE: "success"
  when: on_success

# Runs in the final stage after the pipeline has succeeded and removes this
# pipeline's scratch space, so its
# symlinks no longer keep snakemake cache entries (shared with detector_benchmarks)
# alive for garbage collection.
# This is a separate job rather than part of the .status jobs because:
#  - .status jobs only run for GitHub-triggered pipelines (GITHUB_SHA non-empty),
#  - .status jobs override before_script and never source bin/env.sh, so
#    $LOCAL_DATA_PATH is empty there,
#  - curlimages/curl runs as an unprivileged user and cannot remove files
#    created by the (root) benchmark jobs.
# The path is always /scratch/${CI_PROJECT_NAME}_${CI_PIPELINE_ID}, the default of
# bin/env.sh. A LOCAL_DATA_PATH override or the $PWD/scratch fallback (when
# /scratch is not writable) is deliberately not removed here.
# It is not tied to benchmarks:physics:success with an optional `needs:`: when
# that job is skipped (no GITHUB_SHA), `needs` would let this job start at the
# beginning of the pipeline, while other jobs still use the scratch space.
# Failed pipelines keep their scratch space for debugging. This repository does
# not expire it; on the shared runner, detector_benchmarks' common:setup currently
# removes pipeline scratch directories older than 72 hours.
cleanup:scratch:
  stage: status-report
  image: alpine
  dependencies: []
  variables:
    GIT_STRATEGY: none
  before_script: []
  script:
    - |
      # Only ever remove this pipeline's own directory directly under /scratch;
      # refuse to run if the CI variables used to build the path look wrong.
      case "${CI_PROJECT_NAME}" in
        ""|.|..|*/*) echo "Unexpected CI_PROJECT_NAME='${CI_PROJECT_NAME}', not removing anything"; exit 1 ;;
      esac
      case "${CI_PIPELINE_ID}" in
        ""|*[!0-9]*) echo "Unexpected CI_PIPELINE_ID='${CI_PIPELINE_ID}', not removing anything"; exit 1 ;;
      esac
      SCRATCH_DIR="/scratch/${CI_PROJECT_NAME}_${CI_PIPELINE_ID}"
      echo "Removing ${SCRATCH_DIR}"
      rm -rf -- "${SCRATCH_DIR}"
      df -h /scratch || true
  when: on_success

benchmarks:physics:failure:
  stage: status-report
  dependencies: []
  extends: .status
  variables:
    STATE: "failure"
  when: on_failure
