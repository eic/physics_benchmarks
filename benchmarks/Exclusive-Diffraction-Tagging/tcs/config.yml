tcs:compile:
  stage: compile
  extends: .compile_benchmark
  script:
    - snakemake --cores 1 tcs_compile

# TCS runs sim and reco with caching, but analysis is disabled because the
# analysis code accesses "ReconstructedFFParticles" collection which no longer
# exists. The reco output files are still produced and cached.
tcs:simulate:
  stage: simulate
  extends: .phy_benchmark
  needs: ["tcs:compile"]
  parallel:
    matrix:
      - EBEAM: 5
        PBEAM: 41
        TAG: s450
      - EBEAM: 10
        PBEAM: 100
        TAG: s100
      - EBEAM: 18
        PBEAM: 275
        TAG: s800
  timeout: 2 hours
  script:
    - snakemake $SNAKEMAKE_FLAGS --cores 1 reco/${DETECTOR_CONFIG}/tcs_${EBEAM}x${PBEAM}m_${TAG}.edm4eic.root
  retry:
    max: 2
    when:
      - runner_system_failure

tcs:results:
  stage: collect
  needs: ["tcs:simulate"]
  script:
    - echo "TCS analysis disabled - see Snakefile for details"
